<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipeeestream Donatie Animatie</title>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 22px;
        min-width: min(640px, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        padding: 22px 34px 22px 24px;
        border: 1px solid rgba(125, 92, 255, .55);
        border-radius: 24px;
        background:
            linear-gradient(135deg, rgba(15, 12, 35, .96), rgba(8, 8, 18, .94));
        box-shadow:
            0 0 18px rgba(88, 101, 242, .35),
            0 0 55px rgba(118, 55, 255, .18),
            inset 0 0 30px rgba(88, 101, 242, .08);
        opacity: 0;
        transform: translateY(16px) scale(.94);
        animation:
            cardIn .65s cubic-bezier(.18,.84,.32,1) .1s forwards;
        pointer-events: auto;
    }

    /* Automatische cyclus: zichtbaar -> verborgen -> opnieuw tonen */
    .card.cycle-hidden {
        opacity: 0 !important;
        transform: translateY(-12px) scale(.92) !important;
        pointer-events: none !important;
    }

    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
        transform: translateX(-110%);
        animation: shine 1.25s ease 1.25s forwards;
    }

    .orb {
        position: absolute;
        width: 175px;
        height: 175px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,122,48,.26), transparent 68%);
        filter: blur(2px);
        z-index: -1;
    }

    .logo-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        flex: 0 0 92px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(145deg, #ff8a4c, #e8501f);
        box-shadow:
            0 0 20px rgba(255,122,48,.78),
            0 0 48px rgba(255,100,40,.35);
        opacity: 0;
        transform: rotateY(180deg) scale(.4);
        animation: logoSpin 1.15s cubic-bezier(.2,.8,.2,1) .35s forwards;
    }

    .logo-wrap::after {
        content: "";
        position: absolute;
        inset: -9px;
        border: 2px solid rgba(137, 105, 255, .55);
        border-radius: 25px;
        box-shadow: 0 0 25px rgba(255,100,40,.32);
        animation: pulse 1.5s ease-in-out 1.4s infinite;
    }

    .discord-logo {
        width: 63px;
        height: 63px;
        filter: drop-shadow(0 0 8px rgba(255,255,255,.22));
    }

    .content {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
    }

    .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #ffb88a;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateX(-16px);
        animation: textIn .55s ease 1.08s forwards;
    }

    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff7a30;
        box-shadow: 0 0 12px #ff7a30;
        animation: blink 1s ease-in-out infinite;
    }

    .title {
        margin: 0;
        color: #fff;
        font-size: 27px;
        line-height: 1;
        font-weight: 950;
        font-style: italic;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateX(-24px);
        animation: textIn .62s cubic-bezier(.2,.8,.2,1) 1.23s forwards;
        text-shadow:
            0 0 8px rgba(255,255,255,.12),
            0 0 20px rgba(255,122,48,.35);
    }

    .title .accent {
        color: #ff8a4c;
        text-shadow:
            0 0 10px rgba(255,150,80,.9),
            0 0 25px rgba(255,100,40,.55);
    }

    a.link {
        display: block;
        text-decoration: none;
        cursor: pointer;
        pointer-events: auto;
        transition: background .2s, border-color .2s, transform .2s;
        width: fit-content;
        padding: 8px 14px;
        border-radius: 10px;
        color: #fff;
        background: rgba(255,122,48,.13);
        border: 1px solid rgba(255,150,80,.35);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .4px;
        opacity: 0;
        transform: translateX(-18px) scale(.97);
        animation: linkIn .6s cubic-bezier(.2,.8,.2,1) 1.48s forwards;
        box-shadow: inset 0 0 16px rgba(255,122,48,.08);
    }

    a.link:hover {
        background: rgba(124,106,255,.3);
        border-color: rgba(255,180,120,.8);
    }

    .link strong {
        color: #ffc9a3;
    }

    .particles {
        position: absolute;
        inset: -30px;
        pointer-events: none;
        overflow: visible;
        z-index: -2;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #ff8a4c;
        box-shadow: 0 0 9px #ff8a4c;
        opacity: 0;
        animation: particle 2.8s ease-out infinite;
    }

    .p1 { left: 8%; top: 48%; animation-delay: .4s; }
    .p2 { left: 18%; top: 18%; animation-delay: .8s; }
    .p3 { left: 31%; top: 76%; animation-delay: .15s; }
    .p4 { left: 65%; top: 12%; animation-delay: .65s; }
    .p5 { left: 84%; top: 40%; animation-delay: 1s; }
    .p6 { left: 73%; top: 84%; animation-delay: .25s; }
    .p7 { left: 47%; top: 7%; animation-delay: 1.15s; }
    .p8 { left: 53%; top: 93%; animation-delay: .55s; }

    .panel {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 10px;
        border-radius: 14px;
        background: rgba(10,10,24,.92);
        border: 1px solid rgba(255,140,70,.45);
        pointer-events: auto;
        z-index: 10;
    }
    .panel.hidden { display: none; }
    .panel input {
        width: 250px;
        padding: 9px 12px;
        border-radius: 9px;
        border: 1px solid rgba(255,150,80,.4);
        background: rgba(255,255,255,.06);
        color: #fff;
        font-size: 14px;
        outline: none;
    }
    .panel input:focus { border-color: #ff8a4c; }
    .panel button {
        padding: 9px 14px;
        border: 0;
        border-radius: 9px;
        background: #f06a2a;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }
    .panel button.ghost { background: rgba(255,255,255,.1); }
    .gear { opacity: 0; transition: opacity .2s; }
    .gear:hover { opacity: 1; }
    .gear {
        position: fixed;
        right: 14px;
        bottom: 14px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(255,140,70,.45);
        background: rgba(10,10,24,.85);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        pointer-events: auto;
        z-index: 10;
    }

    @keyframes cardIn {
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes cardOut {
        to {
            opacity: 0;
            transform: translateY(-12px) scale(.92);
        }
    }

    @keyframes logoSpin {
        0% {
            opacity: 0;
            transform: rotateY(180deg) rotateZ(-8deg) scale(.4);
        }
        55% {
            opacity: 1;
            transform: rotateY(-35deg) rotateZ(3deg) scale(1.08);
        }
        100% {
            opacity: 1;
            transform: rotateY(0deg) rotateZ(0deg) scale(1);
        }
    }

    @keyframes textIn {
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes linkIn {
        to {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }

    @keyframes shine {
        to {
            transform: translateX(110%);
        }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: .55; }
        50% { transform: scale(1.06); opacity: .18; }
    }

    @keyframes blink {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
    }

    @keyframes particle {
        0% {
            opacity: 0;
            transform: translate(0, 0) scale(.5);
        }
        15% { opacity: 1; }
        100% {
            opacity: 0;
            transform: translate(var(--x, 35px), var(--y, -35px)) scale(0);
        }
    }

    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 14px; image-rendering: auto; border-radius: 22px; display: none; }
    .logo-wrap.has-img { background: linear-gradient(145deg, #ffffff, #ffe6d6); }
    .logo-wrap.has-img img { display: block; }
    .logo-wrap.has-img .discord-logo { display: none; }
    a.link {
        font-size: 16px;
        padding: 10px 18px;
        background: linear-gradient(90deg, rgba(255,122,48,.38), rgba(255,122,48,.12));
        border-color: rgba(255,150,80,.6);
        box-shadow: 0 0 18px rgba(255,122,48,.25), inset 0 0 16px rgba(255,122,48,.1);
    }
    a.link::after { content: "\2192"; margin-left: 12px; display: inline-block; animation: nudge 1.2s ease-in-out infinite; }
    a.link:hover { transform: translateY(-2px) scale(1.02); }
    .panel label.btn { padding: 9px 14px; border-radius: 9px; background: rgba(255,255,255,.1); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
    @keyframes nudge { 50% { transform: translateX(5px); } }

    a.link { max-width: 100%; overflow-wrap: anywhere; }
    .panel { flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); max-width: 640px; }
    .panel input { flex: 1 1 200px; min-width: 0; width: auto; }
    @media (max-width: 700px), (max-height: 420px) {
        .scene { align-items: flex-start; padding: 12px 0 0; }
        body:has(.panel:not(.hidden)) .scene { padding-bottom: 110px; }
        .card { gap: 12px; padding: 12px 14px 12px 12px; border-radius: 16px; }
        .logo-wrap { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 14px; }
        .logo-wrap::after { inset: -5px; border-radius: 17px; }
        .logo-wrap img { padding: 9px; border-radius: 14px; }
        .discord-logo { width: 38px; height: 38px; }
        .content { gap: 5px; }
        .eyebrow { font-size: 9px; letter-spacing: 2px; }
        .title { font-size: 17px; letter-spacing: 1px; line-height: 1.1; }
        a.link { font-size: 12px; padding: 6px 10px; }
        a.link::after { margin-left: 6px; }
        .panel { bottom: 8px; padding: 8px; gap: 6px; }
        .panel input, .panel button, .panel label.btn { font-size: 12px; padding: 7px 10px; }
    }
</style>
</head>
<body>
<div class="scene">
    <div class="particles">
        <span class="particle p1" style="--x:-55px;--y:-20px;"></span>
        <span class="particle p2" style="--x:-20px;--y:-60px;"></span>
        <span class="particle p3" style="--x:-60px;--y:22px;"></span>
        <span class="particle p4" style="--x:45px;--y:-55px;"></span>
        <span class="particle p5" style="--x:65px;--y:-12px;"></span>
        <span class="particle p6" style="--x:55px;--y:30px;"></span>
        <span class="particle p7" style="--x:10px;--y:-70px;"></span>
        <span class="particle p8" style="--x:-15px;--y:65px;"></span>
    </div>

    <div class="card">
        <div class="orb"></div>

        <div class="logo-wrap">

        </div>

        <div class="content">
            <div class="eyebrow">
                <span class="dot"></span>
                STEUN DE STREAM
            </div>

            <h1 class="title">

</div>

<div class="panel hidden" id="panel">
    <input id="input" type="text" placeholder="Plak hier je stream-link, bv. tipeeestream.com/jouwnaam/donation">
    <label class="btn" for="logoFile">Logo kiezen</label>
    <input id="logoFile" type="file" accept="image/*" style="display:none">
    <button id="apply">Toepassen</button>
    <button class="ghost" id="replay">Opnieuw</button>
    <button class="ghost" id="close">Verberg</button>
</div>
<button class="gear" id="gear" title="Instellingen">⚙</button>

<script>
    const linkEl = document.getElementById("link");
    const input = document.getElementById("input");
    const panel = document.getElementById("panel");
    const card = document.querySelector(".card");

    function setLink(raw) {
        raw = (raw || "").trim() || "https://www.tipeeestream.com/fazenl/donation";
        const href = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
        const shown = raw.replace(/^https?:\/\//i, "").replace(/\/$/, "");
        const i = shown.indexOf("/");
        linkEl.textContent = "";
        if (i > -1) {
            linkEl.append(shown.slice(0, i + 1));
            const b = document.createElement("strong");
            b.textContent = shown.slice(i + 1);
            linkEl.append(b);
        } else {
            linkEl.textContent = shown;
        }
        linkEl.href = href;
        try { localStorage.setItem("streamLink", raw); } catch (e) {}
    }

    let cycleTimer = null;
    const VISIBLE_MS = 30 * 1000;
    const WAIT_MS = 4 * 60 * 1000;

    function replay() {
        card.classList.remove("cycle-hidden");
        card.style.animation = "none";
        card.querySelectorAll("*").forEach(el => el.style.animation = "none");
        void card.offsetWidth;
        card.style.animation = "";
        card.querySelectorAll("*").forEach(el => el.style.animation = "");
    }

    function startCycle() {
        if (cycleTimer) clearTimeout(cycleTimer);

        replay();

        // 30 seconden zichtbaar
        cycleTimer = setTimeout(() => {
            card.classList.add("cycle-hidden");

            // 4 minuten verborgen, daarna opnieuw
            cycleTimer = setTimeout(() => {
                startCycle();
            }, WAIT_MS);
        }, VISIBLE_MS);
    }

    // Vaste donatielink: altijd deze link gebruiken.
    const start = "https://www.tipeeestream.com/fazenl/donation";
    input.value = start;
    setLink(start);

    // ?hide=1 verbergt het instellingenpaneel (handig voor OBS)
    if (new URLSearchParams(location.search).get("hide")) {
        panel.classList.add("hidden");
        document.getElementById("gear").style.display = "none";
    }

    document.getElementById("apply").onclick = () => { setLink(input.value); startCycle(); };
    input.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("apply").click(); });
    document.getElementById("replay").onclick = startCycle;
    document.getElementById("close").onclick = () => panel.classList.add("hidden");
    document.getElementById("gear").onclick = () => panel.classList.toggle("hidden");

    // Logo: kies een afbeelding (PNG/SVG/JPG) of gebruik ?logo=https://.../logo.png
    const logoWrap = document.querySelector(".logo-wrap");
    const logoImg = document.getElementById("logoImg");
    function setLogo(src, save) {
        if (!src) return;
        logoImg.src = src;
        logoWrap.classList.add("has-img");
        if (save) { try { localStorage.setItem("streamLogo", src); } catch (e) {} }
    }
    document.getElementById("logoFile").addEventListener("change", e => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => setLogo(r.result, true);
        r.readAsDataURL(f);
    });
    let startLogo = new URLSearchParams(location.search).get("logo");
    if (!startLogo) { try { startLogo = localStorage.getItem("streamLogo"); } catch (e) {} }
    if (startLogo) setLogo(startLogo, false); else logoWrap.classList.add("has-img");
    document.addEventListener("keydown", e => { if (e.key === "s" && document.activeElement !== input) panel.classList.toggle("hidden"); });

    // Start de automatische cyclus meteen na het laden.
    startCycle();
</script>
</body>
</html>
