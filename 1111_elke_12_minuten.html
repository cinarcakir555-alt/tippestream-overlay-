<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join my Discord</title>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 22px;
        min-width: min(640px, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        padding: 22px 34px 22px 24px;
        border: 1px solid rgba(125, 92, 255, .55);
        border-radius: 24px;
        background:
            linear-gradient(135deg, rgba(15, 12, 35, .96), rgba(8, 8, 18, .94));
        box-shadow:
            0 0 18px rgba(88, 101, 242, .35),
            0 0 55px rgba(118, 55, 255, .18),
            inset 0 0 30px rgba(88, 101, 242, .08);
        opacity: 0;
        transform: translateY(16px) scale(.94);
        animation:
            cardIn .65s cubic-bezier(.18,.84,.32,1) .1s forwards,
            glow 3.2s ease-in-out 1s infinite;
        pointer-events: auto;
    }

    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
        transform: translateX(-110%);
        animation: shine 1.25s ease 1.25s forwards;
    }

    .orb {
        position: absolute;
        width: 175px;
        height: 175px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(88,101,242,.26), transparent 68%);
        filter: blur(2px);
        z-index: -1;
    }

    .logo-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        flex: 0 0 92px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(145deg, #6d78ff, #5841d8);
        box-shadow:
            0 0 20px rgba(88,101,242,.78),
            0 0 48px rgba(123,44,255,.35);
        opacity: 0;
        transform: rotateY(180deg) scale(.4);
        animation: logoSpin 1.15s cubic-bezier(.2,.8,.2,1) .35s forwards;
    }

    .logo-wrap::after {
        content: "";
        position: absolute;
        inset: -9px;
        border: 2px solid rgba(137, 105, 255, .55);
        border-radius: 25px;
        box-shadow: 0 0 25px rgba(123,44,255,.32);
        animation: pulse 1.5s ease-in-out 1.4s infinite;
    }

    .discord-logo {
        width: 63px;
        height: 63px;
        filter: drop-shadow(0 0 8px rgba(255,255,255,.22));
    }

    .content {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
    }

    .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #a89dff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateX(-16px);
        animation: textIn .55s ease 1.08s forwards;
    }

    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7c6aff;
        box-shadow: 0 0 12px #7c6aff;
        animation: blink 1s ease-in-out infinite;
    }

    .title {
        margin: 0;
        color: #fff;
        font-size: 31px;
        line-height: 1;
        font-weight: 950;
        font-style: italic;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateX(-24px);
        animation: textIn .62s cubic-bezier(.2,.8,.2,1) 1.23s forwards;
        text-shadow:
            0 0 8px rgba(255,255,255,.12),
            0 0 20px rgba(88,101,242,.35);
    }

    .title .accent {
        color: #8d73ff;
        text-shadow:
            0 0 10px rgba(141,115,255,.9),
            0 0 25px rgba(123,44,255,.55);
    }

    a.link {
        display: block;
        text-decoration: none;
        cursor: pointer;
        pointer-events: auto;
        max-width: 100%;
        overflow-wrap: anywhere;
        transition: background .2s, border-color .2s, transform .2s;
        width: fit-content;
        padding: 8px 14px;
        border-radius: 10px;
        color: #fff;
        background: linear-gradient(90deg, rgba(88,101,242,.32), rgba(88,101,242,.1));
        border: 1px solid rgba(126,105,255,.55);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .4px;
        opacity: 0;
        transform: translateX(-18px) scale(.97);
        animation: linkIn .6s cubic-bezier(.2,.8,.2,1) 1.48s forwards;
        box-shadow: inset 0 0 16px rgba(88,101,242,.08);
    }

    a.link::after { content: "\2192"; margin-left: 12px; display: inline-block; animation: nudge 1.2s ease-in-out infinite; }
    a.link:hover { background: rgba(88,101,242,.35); border-color: rgba(160,150,255,.85); transform: translateY(-2px) scale(1.02); }

    .hint { color: rgba(184,174,255,.7); font-size: 11px; letter-spacing: 1px; opacity: 0; animation: textIn .5s ease 1.8s forwards; }

    .link strong {
        color: #b8aeff;
    }

    .particles {
        position: absolute;
        inset: -30px;
        pointer-events: none;
        overflow: visible;
        z-index: -2;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #8d73ff;
        box-shadow: 0 0 9px #8d73ff;
        opacity: 0;
        animation: particle 2.8s ease-out infinite;
    }

    .p1 { left: 8%; top: 48%; animation-delay: .4s; }
    .p2 { left: 18%; top: 18%; animation-delay: .8s; }
    .p3 { left: 31%; top: 76%; animation-delay: .15s; }
    .p4 { left: 65%; top: 12%; animation-delay: .65s; }
    .p5 { left: 84%; top: 40%; animation-delay: 1s; }
    .p6 { left: 73%; top: 84%; animation-delay: .25s; }
    .p7 { left: 47%; top: 7%; animation-delay: 1.15s; }
    .p8 { left: 53%; top: 93%; animation-delay: .55s; }

    @keyframes cardIn {
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes cardOut {
        to {
            opacity: 0;
            transform: translateY(-12px) scale(.92);
        }
    }

    @keyframes logoSpin {
        0% {
            opacity: 0;
            transform: rotateY(180deg) rotateZ(-8deg) scale(.4);
        }
        55% {
            opacity: 1;
            transform: rotateY(-35deg) rotateZ(3deg) scale(1.08);
        }
        100% {
            opacity: 1;
            transform: rotateY(0deg) rotateZ(0deg) scale(1);
        }
    }

    @keyframes textIn {
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes linkIn {
        to {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }

    @keyframes shine {
        to {
            transform: translateX(110%);
        }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: .55; }
        50% { transform: scale(1.06); opacity: .18; }
    }

    @keyframes blink {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
    }

    @keyframes particle {
        0% {
            opacity: 0;
            transform: translate(0, 0) scale(.5);
        }
        15% { opacity: 1; }
        100% {
            opacity: 0;
            transform: translate(var(--x, 35px), var(--y, -35px)) scale(0);
        }
    }

    @keyframes nudge { 50% { transform: translateX(5px); } }
    @keyframes glow {
        0%, 100% { box-shadow: 0 0 18px rgba(88,101,242,.35), 0 0 55px rgba(118,55,255,.18), inset 0 0 30px rgba(88,101,242,.08); }
        50% { box-shadow: 0 0 28px rgba(88,101,242,.6), 0 0 75px rgba(118,55,255,.32), inset 0 0 30px rgba(88,101,242,.14); }
    }

    @media (max-width: 700px), (max-height: 320px) {
        .card { gap: 12px; padding: 12px 14px 12px 12px; border-radius: 16px; }
        .logo-wrap { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 14px; }
        .logo-wrap::after { inset: -5px; border-radius: 17px; }
        .discord-logo { width: 38px; height: 38px; }
        .content { gap: 5px; }
        .eyebrow { font-size: 9px; letter-spacing: 2px; }
        .title { font-size: 18px; letter-spacing: 1px; }
        a.link { font-size: 12px; padding: 6px 10px; }
        a.link::after { margin-left: 6px; }
        .hint { display: none; }
    }
</style>
</head>
<body>
<div class="scene">
    <div class="particles">
        <span class="particle p1" style="--x:-55px;--y:-20px;"></span>
        <span class="particle p2" style="--x:-20px;--y:-60px;"></span>
        <span class="particle p3" style="--x:-60px;--y:22px;"></span>
        <span class="particle p4" style="--x:45px;--y:-55px;"></span>
        <span class="particle p5" style="--x:65px;--y:-12px;"></span>
        <span class="particle p6" style="--x:55px;--y:30px;"></span>
        <span class="particle p7" style="--x:10px;--y:-70px;"></span>
        <span class="particle p8" style="--x:-15px;--y:65px;"></span>
    </div>

    <div class="card">
        <div class="orb"></div>

        <div class="logo-wrap">
            <svg class="discord-logo" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg" aria-label="Discord">
                <path fill="#fff" d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.08 0A72.37 72.37 0 0 0 45.67 0 105.89 105.89 0 0 0 19.4 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2.02 20.94 9.77 43.65 9.77 64.34 0 .87.7 1.76 1.36 2.66 2.02a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.52-51.1-18.91-72.15ZM42.45 65.69c-6.27 0-11.45-5.76-11.45-12.83 0-7.08 5.08-12.84 11.45-12.84 6.37 0 11.55 5.76 11.45 12.84 0 7.07-5.08 12.83-11.45 12.83Zm42.24 0c-6.27 0-11.45-5.76-11.45-12.83 0-7.08 5.08-12.84 11.45-12.84 6.37 0 11.55 5.76 11.45 12.84 0 7.07-5.08 12.83-11.45 12.83Z"/>
            </svg>
        </div>

        <div class="content">
            <div class="eyebrow">
                <span class="dot"></span>
                LIVE COMMUNITY
            </div>

            <h1 class="title">
                <span class="accent">JOIN</span> MY DISCORD
            </h1>

            <a class="link" id="link" href="https://discord.gg/qs4uQ8dmJh" target="_blank" rel="noopener">discord.gg/<strong>qs4uQ8dmJh</strong></a>
            <div class="hint">KLIK OM TE JOINEN</div>
        </div>
    </div>
</div>

<script>
    // Link aanpassen? Zet ?link=https://discord.gg/jouwcode achter de bestandsnaam.
    const invite = new URLSearchParams(location.search).get("link") || "https://discord.gg/qs4uQ8dmJh";
    const a = document.getElementById("link");
    const href = /^https?:\/\//i.test(invite) ? invite : "https://" + invite;
    const shown = href.replace(/^https?:\/\//i, "").replace(/\/$/, "");
    const i = shown.lastIndexOf("/");
    a.textContent = "";
    a.append(shown.slice(0, i + 1));
    const b = document.createElement("strong");
    b.textContent = shown.slice(i + 1);
    a.append(b);
    a.href = href;

    // Cyclus: 30 seconden zichtbaar -> weg -> 6 minuten wachten -> opnieuw.
    const VISIBLE_MS = 30 * 1000;
    const WAIT_MS = 6 * 60 * 1000;
    const card = document.querySelector('.card');

    // Zet alle animaties terug, zodat ook de intro-animaties iedere cyclus opnieuw spelen.
    function resetAnimations() {
        const animated = [
            card,
            card.querySelector('.logo-wrap'),
            card.querySelector('.eyebrow'),
            card.querySelector('.title'),
            card.querySelector('a.link'),
            card.querySelector('.hint')
        ];

        animated.forEach(el => {
            el.style.animation = 'none';
        });

        // Forceer een reflow zodat de browser de animaties echt opnieuw initialiseert.
        void card.offsetWidth;

        animated.forEach(el => {
            el.style.animation = '';
        });
    }

    function showCard() {
        card.style.animation = '';
        resetAnimations();

        setTimeout(() => {
            // Fade/slide de banner weg na 30 seconden.
            card.style.animation = 'cardOut .65s ease forwards';

            setTimeout(() => {
                // Volledig verborgen houden tijdens de wachttijd.
                card.style.visibility = 'hidden';

                setTimeout(() => {
                    card.style.visibility = 'visible';
                    showCard();
                }, WAIT_MS);
            }, 650);
        }, VISIBLE_MS);
    }

    // Eerste keer direct tonen; daarna eindeloos herhalen.
    showCard();
</script>
</body>
</html>
